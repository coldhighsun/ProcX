name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # MinVer needs the full history and tags

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Build
        run: dotnet build ProcX.slnx -c Release

      - name: Test
        run: dotnet test --solution ProcX.slnx -c Release --no-build

  package:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install Inno Setup 7
        run: winget install --id JRSoftware.InnoSetup.7 --silent --accept-package-agreements --accept-source-agreements --scope user

      - name: Package
        shell: pwsh
        run: ./build/publish.ps1 -Runtime win-x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ProcX-win-x64
          path: |
            artifacts/*/*
            !artifacts/*/SHA256SUMS.txt

  release:
    needs: package
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: ProcX-*
          path: dist
          merge-multiple: true

      - name: Create SHA256SUMS.txt
        shell: pwsh
        run: |
          $sums = Get-ChildItem dist -File | Sort-Object Name | ForEach-Object {
            '{0}  {1}' -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          }
          Set-Content dist/SHA256SUMS.txt $sums -Encoding ascii

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
